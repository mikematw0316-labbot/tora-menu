  .item .price{font-size:1.0rem; font-weight:600; color:var(--price); white-space:nowrap}

function itemHTML(x){
  return `<div class="item">
    <div class="row"><span class="name">${x.name}</span><span class="price">${x.price}</span></div>
    ${x.it?`<div class="ln"><span class="lang">IT</span><span class="it">${x.it}</span></div>`:""}
    ${x.en?`<div class="ln"><span class="lang">EN</span><span class="en">${x.en}</span></div>`:""}
    ${x.zh?`<div class="ln"><span class="lang">中</span><span class="zh">${x.zh}</span></div>`:""}
  </div>`;
}
document.getElementById("menu").innerHTML = MENU.map(s=>`
  <section id="${s.id}">
    <div class="sec-head"><div class="s-main"><span class="s-it">${s.it}</span><span class="s-en">${s.en}</span></div><div class="s-zh">${s.zh}</div></div>
    <div class="items">${s.items.map(itemHTML).join("")}</div>
  </section>`).join("");
document.getElementById("toc").innerHTML = MENU.map(s=>`<a href="#${s.id}">${s.zh.split(" · ")[0].replace(/\(.*\)/,"")}</a>`).join("");
</script>
