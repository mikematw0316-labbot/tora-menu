<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TORA · Menu</title>
<meta name="description" content="Tora Sushi 菜單(義/英原文 + 中文翻譯)">
<style>
  :root{
    --bg:#0a0a0a; --fg:#f2f2f2; --it:#eaeaea; --en:#9a9a9a; --zh:#c9a46a;
    --line:#2a2a2a; --price:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Helvetica Neue","PingFang TC","Noto Sans TC",Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:720px; margin:0 auto; padding:2rem 1.3rem 4rem}

  header.top{padding:1rem 0 2rem; border-bottom:1px solid var(--line); margin-bottom:1.5rem}
  header.top .brand{font-size:2rem; font-weight:700; letter-spacing:.06em}
  header.top .sub{font-size:.85rem; letter-spacing:.24em; color:var(--en); text-transform:uppercase; margin-top:.3rem}
  header.top .note{font-size:.78rem; color:var(--en); margin-top:.7rem}

  section{margin:2.4rem 0 0}
  .sec-head{border-bottom:1px solid var(--line); padding-bottom:.5rem; margin-bottom:1.3rem}
  .sec-head .s-main{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap}
  .sec-head .s-it{font-size:1.35rem; font-weight:600; letter-spacing:.02em}
  .sec-head .s-en{font-size:1.05rem; color:var(--en); letter-spacing:.03em}
  .sec-head .s-zh{font-size:.9rem; color:var(--zh); margin-top:.25rem}

  .items{display:flex; flex-direction:column; gap:1.5rem}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:1.5rem 2rem}
  @media(max-width:560px){ .grid2{grid-template-columns:1fr} }

  .item .row{display:flex; align-items:baseline; justify-content:space-between; gap:.8rem}
  .item .name{font-size:1.06rem; font-weight:600; letter-spacing:.02em}
  .item .price{font-size:1.02rem; font-weight:600; color:var(--price); white-space:nowrap}
  .item .ln{display:flex; gap:.5rem; margin-top:.22rem}
  .item .lang{flex:0 0 auto; width:1.5rem; font-size:.6rem; font-weight:700; letter-spacing:.05em; color:var(--zh); padding-top:.18rem; text-align:right}
  .item .it{color:var(--it); font-size:.92rem}
  .item .en{color:var(--en); font-size:.88rem; font-style:italic}
  .item .zh{color:var(--zh); font-size:.9rem}

  footer{margin-top:3rem; padding-top:1.3rem; border-top:1px solid var(--line); color:var(--en); font-size:.78rem; text-align:center; line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">TORA</div>
    <div class="sub">Sushi &amp; Asian Cuisine</div>
  </header>
  <main id="menu"></main>
  <footer>
    Tora Sushi Restaurant · Menu<br>
    中文為翻譯參考,實際餐點/價格以店家為準
  </footer>
</div>

function itemHTML(x){
  return `<div class="item">
    <div class="row"><span class="name">${x.name}</span><span class="price">${x.price}</span></div>
    ${x.it?`<div class="ln"><span class="lang">IT</span><span class="it">${x.it}</span></div>`:""}
    ${x.en?`<div class="ln"><span class="lang">EN</span><span class="en">${x.en}</span></div>`:""}
    ${x.zh?`<div class="ln"><span class="lang">中</span><span class="zh">${x.zh}</span></div>`:""}
  </div>`;
}
document.getElementById("menu").innerHTML = MENU.map(sec=>`
  <section>

      <div class="s-main"><span class="s-it">${sec.it}</span><span class="s-en">${sec.en}</span></div>
      ${sec.zh?`<div class="s-zh">${sec.zh}</div>`:""}

</html>
